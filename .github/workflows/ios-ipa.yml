name: iOS IPA (ongetekend)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Bouw zonder ondertekening en pak als .ipa
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr "$GITHUB_WORKSPACE/PDF-Studio.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-ipa
          path: PDF-Studio.ipa
